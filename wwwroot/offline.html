<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Offline – MediRemind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
    <div class="text-center max-w-sm">
        <div class="w-16 h-16 bg-slate-200 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M15.536 8.464a5 5 0 010 7.072M6.343 17.657A9 9 0 015.636 5.636M8.464 15.536a5 5 0 010-7.072M12 12h.01"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-800 mb-2">You're offline</h1>
        <p class="text-slate-500 text-sm mb-6">No internet connection. Some pages may still be available from cache.</p>
        <div class="space-y-2 text-sm">
            <p class="font-semibold text-slate-600 mb-3">Try these cached pages:</p>
            <a href="/Dashboard"    class="block text-sky-600 hover:underline">Today's Schedule</a>
            <a href="/Medications"  class="block text-sky-600 hover:underline">My Medications</a>
            <a href="/Login"        class="block text-sky-600 hover:underline">Login</a>
        </div>
        <button onclick="window.location.reload()" class="mt-8 bg-sky-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-sky-700 transition text-sm">
            Try Again
        </button>
    </div>
</body>
</html>
